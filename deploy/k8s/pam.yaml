# PAM Platform — Kubernetes manifests (mirrors deploy/docker/docker-compose.yml).
#
# Apply:
#   kubectl apply -f deploy/k8s/pam.yaml
#
# Production additions to consider: PDBs, NetworkPolicies, HPAs, PodSecurity,
# Vault-CSI for secrets, Ingress with TLS, external storage class for PVCs.

apiVersion: v1
kind: Namespace
metadata:
  name: pam
---
# --- Secrets (replace before deploying to production) ---
apiVersion: v1
kind: Secret
metadata:
  name: pam-secrets
  namespace: pam
type: Opaque
stringData:
  PAM_JWT_SECRET: "change-me-in-real-deployment"
  PAM_MASTER_KEY: ""                    # base64 32-byte vault key; leave blank to auto-create on first boot
  PAM_TACACS_SECRET: "change-me"        # TACACS+ shared secret
  PAM_ADMIN_PASS: "admin"               # bootstrap admin password (first run only)
---
# --- Shared config ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pam-config
  namespace: pam
data:
  PAM_DB: "file:/data/pam.db?cache=shared&_pragma=foreign_keys(1)&_pragma=journal_mode(WAL)"
  PAM_AUDIT_JSONL: "/data/audit.jsonl"
  PAM_REC_DIR: "/recordings"
  PAM_ADMIN_USER: "admin"
  PAM_AUTH_URL: "http://auth:8081"
  PAM_VAULT_URL: "http://vault:8082"
  PAM_POLICY_URL: "http://policy:8083"
  PAM_APPROVAL_URL: "http://approval:8084"
  PAM_AUDIT_URL: "http://audit:8085"
  PAM_RDP_PROXY_URL: "http://rdp-proxy:8086"
  PAM_GUACD_ADDR: "guacd:4822"
  PAM_SSH_PROXY_DIAL_ADDR: "ssh-proxy:2222"
  PAM_PORTAL_URL: "http://pam.example.local:8080"
---
# --- Shared persistent storage (SQLite DB + audit log + session recordings) ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pam-data
  namespace: pam
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pam-rec
  namespace: pam
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 50Gi
---
# =========================================================================
# auth-service
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth, namespace: pam }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: auth } }
  template:
    metadata: { labels: { app: auth } }
    spec:
      containers:
        - name: auth
          image: pam-platform:latest
          imagePullPolicy: IfNotPresent
          args: ["/app/auth-service"]
          ports: [{ name: http, containerPort: 8081 }]
          envFrom:
            - secretRef: { name: pam-secrets }
            - configMapRef: { name: pam-config }
          env:
            - { name: PAM_AUTH_ADDR, value: ":8081" }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: rec,  mountPath: /recordings }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: pam-data } }
        - { name: rec,  persistentVolumeClaim: { claimName: pam-rec } }
---
apiVersion: v1
kind: Service
metadata: { name: auth, namespace: pam }
spec:
  type: ClusterIP
  selector: { app: auth }
  ports: [{ port: 8081, targetPort: 8081 }]
---
