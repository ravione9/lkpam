# Minimal Kubernetes manifests. Production would add PDBs, NetworkPolicies,
# HPAs, PodSecurity, Vault-CSI for secrets, etc.
apiVersion: v1
kind: Namespace
metadata:
  name: pam
---
apiVersion: v1
kind: Secret
metadata: { name: pam-secrets, namespace: pam }
type: Opaque
stringData:
  PAM_JWT_SECRET: "change-me-in-real-deployment"
  PAM_MASTER_KEY: ""   # set to a base64'd 32-byte key once HSM is wired in
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: pam }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: pam-platform:latest
          args: ["/app/api-gateway"]
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: pam-secrets } }]
          env:
            - { name: PAM_AUTH_URL,     value: "http://auth:8081" }
            - { name: PAM_VAULT_URL,    value: "http://vault:8082" }
            - { name: PAM_POLICY_URL,   value: "http://policy:8083" }
            - { name: PAM_APPROVAL_URL, value: "http://approval:8084" }
            - { name: PAM_AUDIT_URL,    value: "http://audit:8085" }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: pam }
spec:
  type: ClusterIP
  selector: { app: gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
---
# (Repeat Deployment+Service for auth/vault/policy/approval/audit/ssh-proxy
#  with matching args, ports, and replicas. ssh-proxy is exposed via a
#  separate LoadBalancer service on port 2222.)
