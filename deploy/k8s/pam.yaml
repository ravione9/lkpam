# =========================================================================
# guacd (Apache Guacamole proxy daemon — terminates RDP/SSH for browser viewers)
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata: { name: guacd, namespace: pam }
spec:
  replicas: 1
  selector: { matchLabels: { app: guacd } }
  template:
    metadata: { labels: { app: guacd } }
    spec:
      containers:
        - name: guacd
          image: guacamole/guacd:1.5.5
          ports: [{ name: guac, containerPort: 4822 }]
          volumeMounts:
            - { name: rec, mountPath: /recordings }
      volumes:
        - { name: rec, persistentVolumeClaim: { claimName: pam-rec } }
---
apiVersion: v1
kind: Service
metadata: { name: guacd, namespace: pam }
spec:
  type: ClusterIP
  selector: { app: guacd }
  ports: [{ port: 4822, targetPort: 4822 }]
---
# =========================================================================
# rdp-proxy (browser WebSocket → guacd; also brokers recorded browser SSH)
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata: { name: rdp-proxy, namespace: pam }
spec:
  replicas: 1
  selector: { matchLabels: { app: rdp-proxy } }
  template:
    metadata: { labels: { app: rdp-proxy } }
    spec:
      containers:
        - name: rdp-proxy
          image: pam-platform:latest
          imagePullPolicy: IfNotPresent
          args: ["/app/rdp-proxy"]
          ports: [{ name: http, containerPort: 8086 }]
          envFrom:
            - secretRef: { name: pam-secrets }
            - configMapRef: { name: pam-config }
          env:
            - { name: PAM_RDP_PROXY_ADDR, value: ":8086" }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: rec,  mountPath: /recordings }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: pam-data } }
        - { name: rec,  persistentVolumeClaim: { claimName: pam-rec } }
---
apiVersion: v1
kind: Service
metadata: { name: rdp-proxy, namespace: pam }
spec:
  type: ClusterIP
  selector: { app: rdp-proxy }
  ports: [{ port: 8086, targetPort: 8086 }]
---
# =========================================================================
# ssh-proxy (privileged SSH data plane, port 2222 — exposed externally)
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata: { name: ssh-proxy, namespace: pam }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: ssh-proxy } }
  template:
    metadata: { labels: { app: ssh-proxy } }
    spec:
      containers:
        - name: ssh-proxy
          image: pam-platform:latest
          imagePullPolicy: IfNotPresent
          args: ["/app/ssh-proxy"]
          ports: [{ name: ssh, containerPort: 2222 }]
          envFrom:
            - secretRef: { name: pam-secrets }
            - configMapRef: { name: pam-config }
          env:
            - { name: PAM_SSH_PROXY_ADDR, value: ":2222" }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: rec,  mountPath: /recordings }
          readinessProbe:
            tcpSocket: { port: ssh }
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: ssh }
            periodSeconds: 30
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: pam-data } }
        - { name: rec,  persistentVolumeClaim: { claimName: pam-rec } }
---
apiVersion: v1
kind: Service
metadata: { name: ssh-proxy, namespace: pam }
spec:
  type: LoadBalancer
  selector: { app: ssh-proxy }
  ports:
    - name: ssh
      port: 2222
      targetPort: 2222
---
# =========================================================================
# tacacs-service (TACACS+ AAA for network devices — listens on port 49 and is
# exposed externally on port 49 via LoadBalancer)
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata: { name: tacacs, namespace: pam }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: tacacs } }
  template:
    metadata: { labels: { app: tacacs } }
    spec:
      containers:
        - name: tacacs
          image: pam-platform:latest
          imagePullPolicy: IfNotPresent
          args: ["/app/tacacs-service"]
          ports: [{ name: tacacs, containerPort: 49 }]
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
          envFrom:
            - secretRef: { name: pam-secrets }
            - configMapRef: { name: pam-config }
          env:
            - { name: PAM_TACACS_ADDR, value: ":49" }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            tcpSocket: { port: tacacs }
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: tacacs }
            periodSeconds: 30
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: pam-data } }
---
apiVersion: v1
kind: Service
metadata: { name: tacacs, namespace: pam }
spec:
  type: LoadBalancer
  selector: { app: tacacs }
  ports:
    - name: tacacs
      port: 49
      targetPort: 49
---
# =========================================================================
# api-gateway (admin UI + REST API, port 8080 — exposed externally)
# =========================================================================
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: pam }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: pam-platform:latest
          imagePullPolicy: IfNotPresent
          args: ["/app/api-gateway"]
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - secretRef: { name: pam-secrets }
            - configMapRef: { name: pam-config }
          env:
            - { name: PAM_GATEWAY_ADDR, value: ":8080" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: pam }
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
