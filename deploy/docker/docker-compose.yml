# PAM Platform — Docker Compose deployment
#
# Quick start (from repo root):
#   cp deploy/docker/.env.example deploy/docker/.env
#   cp deploy/docker/secrets.env.example deploy/docker/secrets.env
#   docker compose -f deploy/docker/docker-compose.yml up --build -d
#
# Secrets go in deploy/docker/secrets.env (not .env) so $ in passwords is safe.
#
# Admin UI:  http://localhost:8080  (default admin / admin)
# SSH proxy: ssh -p 2222 "user@#target-id@localhost"
# TACACS+:  host port 49 (PAM_TACACS_PORT) — shared secret PAM_TACACS_SECRET

name: pam

x-common: &common
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  image: pam-platform:latest
  restart: unless-stopped
  networks: [pam-net]
  # secrets.env is passed to containers only — Compose does not expand $ inside it.
  env_file:
    - path: secrets.env
      required: false
  environment: &common-env
    PAM_DB: "file:/data/pam.db?cache=shared&_pragma=foreign_keys(1)&_pragma=journal_mode(WAL)"
    PAM_AUDIT_JSONL: "/data/audit.jsonl"
    PAM_REC_DIR: "/recordings"
  volumes:
    - pam-data:/data
    - pam-rec:/recordings

x-http-health: &http-health
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  auth:
    <<: *common
    container_name: pam-auth
    command: ["/app/auth-service"]
    environment:
      <<: *common-env
      PAM_AUTH_ADDR: ":8081"
      PAM_PORTAL_URL: "${PAM_PORTAL_URL:-http://localhost:8080}"
      PAM_LDAP_SYNC_INTERVAL: "${PAM_LDAP_SYNC_INTERVAL:-5m}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      <<: *http-health

  vault:
    <<: *common
    container_name: pam-vault
    command: ["/app/vault-service"]
    environment:
      <<: *common-env
      PAM_VAULT_ADDR: ":8082"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health"]
      <<: *http-health

  policy:
    <<: *common
    container_name: pam-policy
    command: ["/app/policy-service"]
    environment:
      <<: *common-env
      PAM_POLICY_ADDR: ":8083"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/health"]
      <<: *http-health

  approval:
    <<: *common
    container_name: pam-approval
    command: ["/app/approval-service"]
    environment:
      <<: *common-env
      PAM_APPROVAL_ADDR: ":8084"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/health"]
      <<: *http-health

  audit:
    <<: *common
    container_name: pam-audit
    command: ["/app/audit-service"]
    environment:
      <<: *common-env
      PAM_AUDIT_ADDR: ":8085"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8085/health"]
      <<: *http-health

  ssh-proxy:
    <<: *common
    container_name: pam-ssh-proxy
    command: ["/app/ssh-proxy"]
    environment:
      <<: *common-env
      PAM_SSH_PROXY_ADDR: ":2222"
    depends_on:
      vault:
        condition: service_healthy
      policy:
        condition: service_healthy
    ports:
      - "${PAM_SSH_PORT:-2222}:2222"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2222"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: pam-guacd
    restart: unless-stopped
    # Image default USER is guacd; entrypoint must chmod /recordings as root.
    user: "0:0"
    networks: [pam-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "/guacd-entrypoint.sh"]
    volumes:
      - pam-rec:/recordings
      - ./guacd-entrypoint.sh:/guacd-entrypoint.sh:ro

  rdp-proxy:
    <<: *common
    container_name: pam-rdp-proxy
    command: ["/app/rdp-proxy"]
    environment:
      <<: *common-env
      PAM_RDP_PROXY_ADDR: ":8086"
      PAM_GUACD_ADDR: "guacd:4822"
      # Map target localhost/127.0.0.1 to a host reachable from guacd (Windows Docker Desktop).
      PAM_RDP_DOCKER_HOST: "${PAM_RDP_DOCKER_HOST:-host.docker.internal}"
      PAM_SSH_PROXY_DIAL_ADDR: "ssh-proxy:2222"
      # true = always guacd→ssh-proxy (PuTTY path). false = try privileged direct, else ssh-proxy.
      PAM_BROWSER_SSH_VIA_PROXY: "${PAM_BROWSER_SSH_VIA_PROXY:-true}"
      # true = never fall back to ssh-proxy (requires privileged account on every target).
      PAM_BROWSER_SSH_DIRECT_ONLY: "${PAM_BROWSER_SSH_DIRECT_ONLY:-false}"
      PAM_AUTH_URL: "http://auth:8081"
    depends_on:
      guacd:
        condition: service_started
      ssh-proxy:
        condition: service_started
      auth:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8086/health"]
      <<: *http-health

  gateway:
    <<: *common
    container_name: pam-gateway
    command: ["/app/api-gateway"]
    environment:
      <<: *common-env
      PAM_GATEWAY_ADDR: ":8080"
      PAM_AUTH_URL: "http://auth:8081"
      PAM_VAULT_URL: "http://vault:8082"
      PAM_POLICY_URL: "http://policy:8083"
      PAM_APPROVAL_URL: "http://approval:8084"
      PAM_AUDIT_URL: "http://audit:8085"
      PAM_RDP_PROXY_URL: "http://rdp-proxy:8086"
      PAM_PORTAL_URL: "${PAM_PORTAL_URL:-http://localhost:8080}"
    depends_on:
      auth:
        condition: service_healthy
      vault:
        condition: service_healthy
      policy:
        condition: service_healthy
      approval:
        condition: service_healthy
      audit:
        condition: service_healthy
      rdp-proxy:
        condition: service_healthy
    ports:
      - "${PAM_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      <<: *http-health

  # TACACS+ AAA for network devices (Cisco IOS, etc.)
  tacacs:
    <<: *common
    container_name: pam-tacacs
    command: ["/app/tacacs-service"]
    environment:
      <<: *common-env
      PAM_TACACS_ADDR: ":49"
      PAM_AUTH_URL: "http://auth:8081"
    depends_on:
      auth:
        condition: service_healthy
      policy:
        condition: service_healthy
    ports:
      - "${PAM_TACACS_PORT:-49}:49"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "49"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  pam-net:
    driver: bridge

volumes:
  pam-data:
    name: pam-data
  pam-rec:
    name: pam-rec
