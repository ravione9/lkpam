# PAM Platform — Docker Compose deployment
#
# Quick start (from repo root):
#   cp deploy/docker/.env.example deploy/docker/.env
#   cp deploy/docker/secrets.env.example deploy/docker/secrets.env
#   docker compose -f deploy/docker/docker-compose.yml up --build -d
#
# Secrets go in deploy/docker/secrets.env (not .env) so $ in passwords is safe.
#
# Admin UI:  http://localhost:8080  (default admin / admin)
# SSH proxy: ssh -p 2222 "user@#target-id@localhost"
# TACACS+:  host port 49 (PAM_TACACS_PORT) — shared secret PAM_TACACS_SECRET
# RADIUS:   host ports 1812/udp (auth) + 1813/udp (acct) — shared secret PAM_RADIUS_SECRET

name: pam

x-common: &common
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  image: pam-platform:latest
  restart: unless-stopped
  networks: [pam-net]
  # secrets.env is passed to containers only — Compose does not expand $ inside it.
  env_file:
    - path: secrets.env
      required: false
  environment: &common-env
    PAM_DB: "file:/data/pam.db?cache=shared&_pragma=foreign_keys(1)&_pragma=journal_mode(WAL)"
    PAM_AUDIT_JSONL: "/data/audit.jsonl"
    PAM_REC_DIR: "/recordings"
  volumes:
    - pam-data:/data
    - pam-rec:/recordings

x-http-health: &http-health
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  auth:
    <<: *common
    container_name: pam-auth
    command: ["/app/auth-service"]
    environment:
      <<: *common-env
      PAM_AUTH_ADDR: ":8081"
      PAM_PORTAL_URL: "${PAM_PORTAL_URL:-http://localhost:8080}"
      PAM_DB_BROKER_HOST: "${PAM_DB_BROKER_HOST:-localhost}"
      PAM_LDAP_SYNC_INTERVAL: "${PAM_LDAP_SYNC_INTERVAL:-5m}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      <<: *http-health

  vault:
    <<: *common
    container_name: pam-vault
    command: ["/app/vault-service"]
    environment:
      <<: *common-env
      PAM_VAULT_ADDR: ":8082"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health"]
      <<: *http-health

  policy:
    <<: *common
    container_name: pam-policy
    command: ["/app/policy-service"]
    environment:
      <<: *common-env
      PAM_POLICY_ADDR: ":8083"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/health"]
      <<: *http-health

  approval:
    <<: *common
    container_name: pam-approval
    command: ["/app/approval-service"]
    environment:
      <<: *common-env
      PAM_APPROVAL_ADDR: ":8084"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/health"]
      <<: *http-health

  audit:
    <<: *common
    container_name: pam-audit
    command: ["/app/audit-service"]
    environment:
      <<: *common-env
      PAM_AUDIT_ADDR: ":8085"
      PAM_RECORDINGS_PERMS_LOOP: "1"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8085/health"]
      <<: *http-health

  ssh-proxy:
    <<: *common
    container_name: pam-ssh-proxy
    command: ["/app/ssh-proxy"]
    environment:
      <<: *common-env
      PAM_SSH_PROXY_ADDR: ":2222"
    depends_on:
      vault:
        condition: service_healthy
      policy:
        condition: service_healthy
    ports:
      - "${PAM_SSH_PORT:-2222}:2222"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2222"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-proxy:
    <<: *common
    container_name: pam-db-proxy
    command: ["/app/db-proxy"]
    environment:
      <<: *common-env
      PAM_DB_POSTGRES_PORT: "15432"
      PAM_DB_MYSQL_PORT: "13306"
      PAM_DB_MSSQL_PORT: "11433"
      PAM_DB_MONGODB_PORT: "27018"
      PAM_DB_REDIS_PORT: "16379"
      PAM_DB_ORACLE_PORT: "11521"
    depends_on:
      vault:
        condition: service_healthy
    ports:
      - "${PAM_DB_POSTGRES_PORT:-15432}:15432"
      - "${PAM_DB_MYSQL_PORT:-13306}:13306"
      - "${PAM_DB_REDIS_PORT:-16379}:16379"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "15432"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # guacd uses the HOST network so RDP dials to LAN targets (192.168.x.x) use the
  # PAM server IP — bridge-network guacd often gets UPSTREAM_NOT_FOUND (519).
  # On Windows Docker Desktop only, comment network_mode and restore networks/extra_hosts below.
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: pam-guacd
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    entrypoint: ["/bin/sh", "/guacd-entrypoint.sh"]
    volumes:
      - pam-rec:/recordings
      - ./guacd-entrypoint.sh:/guacd-entrypoint.sh:ro
      - ./fix-recordings-perms.sh:/fix-recordings-perms.sh:ro

  rdp-proxy:
    <<: *common
    container_name: pam-rdp-proxy
    command: ["/app/rdp-proxy"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *common-env
      PAM_RDP_PROXY_ADDR: ":8086"
      PAM_GUACD_ADDR: "${PAM_GUACD_ADDR:-host.docker.internal:4822}"
      # Map target localhost/127.0.0.1 to a host reachable from guacd (Windows Docker Desktop).
      PAM_RDP_DOCKER_HOST: "${PAM_RDP_DOCKER_HOST:-host.docker.internal}"
      # guacd uses host network — must dial loopback or the PAM host IP, not "ssh-proxy".
      PAM_SSH_PROXY_DIAL_ADDR: "${PAM_SSH_PROXY_DIAL_ADDR:-127.0.0.1:2222}"
      # true = always guacd→ssh-proxy (PuTTY path). false = try privileged direct, else ssh-proxy.
      PAM_BROWSER_SSH_VIA_PROXY: "${PAM_BROWSER_SSH_VIA_PROXY:-true}"
      # true = never fall back to ssh-proxy (requires privileged account on every target).
      PAM_BROWSER_SSH_DIRECT_ONLY: "${PAM_BROWSER_SSH_DIRECT_ONLY:-false}"
      PAM_AUTH_URL: "http://auth:8081"
    depends_on:
      guacd:
        condition: service_started
      ssh-proxy:
        condition: service_started
      auth:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8086/health"]
      <<: *http-health

  gateway:
    <<: *common
    container_name: pam-gateway
    command: ["/app/api-gateway"]
    environment:
      <<: *common-env
      PAM_GATEWAY_ADDR: ":8080"
      PAM_AUTH_URL: "http://auth:8081"
      PAM_VAULT_URL: "http://vault:8082"
      PAM_POLICY_URL: "http://policy:8083"
      PAM_APPROVAL_URL: "http://approval:8084"
      PAM_AUDIT_URL: "http://audit:8085"
      PAM_RDP_PROXY_URL: "http://rdp-proxy:8086"
      PAM_PORTAL_URL: "${PAM_PORTAL_URL:-http://localhost:8080}"
      PAM_DB_BROKER_HOST: "${PAM_DB_BROKER_HOST:-localhost}"
    depends_on:
      auth:
        condition: service_healthy
      vault:
        condition: service_healthy
      policy:
        condition: service_healthy
      approval:
        condition: service_healthy
      # Portal HTTP must stay up even when RDP/guacd or audit health checks fail.
      audit:
        condition: service_started
      rdp-proxy:
        condition: service_started
    ports:
      - "${PAM_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      <<: *http-health

  # RADIUS AAA for network devices that don't speak TACACS+: HP/Aruba switches,
  # MikroTik, F5, Palo Alto admin, Juniper, Huawei, VPN concentrators, WLCs.
  # Per-NAS shared secrets live in the radius_clients table; PAM_RADIUS_SECRET
  # is the global fallback for any NAS without a per-device row.
  radius:
    <<: *common
    container_name: pam-radius
    command: ["/app/radius-service"]
    environment:
      <<: *common-env
      PAM_RADIUS_AUTH_ADDR: ":1812"
      PAM_RADIUS_ACCT_ADDR: ":1813"
      PAM_AUTH_URL: "http://auth:8081"
      # 'reject' (default) returns Access-Reject for users not in the portal,
      # stopping the NAS method list. Set to 'drop' for silent fallthrough so
      # the NAS tries its next method (e.g. 'group radius local').
      PAM_RADIUS_UNKNOWN_USER: "${PAM_RADIUS_UNKNOWN_USER:-reject}"
    depends_on:
      auth:
        condition: service_healthy
      policy:
        condition: service_healthy
    ports:
      - "${PAM_RADIUS_AUTH_PORT:-1812}:1812/udp"
      - "${PAM_RADIUS_ACCT_PORT:-1813}:1813/udp"
    # UDP has no handshake, so "is the port open" can't be tested with nc -z
    # reliably. Use pidof on the binary instead — Alpine's busybox always
    # has pidof.
    healthcheck:
      test: ["CMD-SHELL", "pidof radius-service > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  # TACACS+ AAA for network devices (Cisco IOS, etc.)
  tacacs:
    <<: *common
    container_name: pam-tacacs
    command: ["/app/tacacs-service"]
    environment:
      <<: *common-env
      PAM_TACACS_ADDR: ":49"
      PAM_AUTH_URL: "http://auth:8081"
      # FortiGate role → admin_prof mapping.
      # Format: "pam_role=fortinet_profile,..." (comma-separated, no spaces)
      # Built-in defaults: admin=super_admin, secops=super_admin, everything else=prof_admin
      # Common FortiGate profiles: super_admin  read_write  prof_admin  no_access
      # Uncomment and customize to assign different profiles per PAM role:
      #PAM_TACACS_FORTINET_PROFILES: "admin=super_admin,secops=read_write,netops=prof_admin,user=no_access,viewer=no_access"
      # FortiGate role → memberof group mapping (for group-based profile assignment on the firewall).
      # Format: "pam_role=FG-GroupName,..."
      # Falls back to PAM_TACACS_FORTINET_MEMBEROF for roles not listed.
      #PAM_TACACS_FORTINET_MEMBEROF_MAP: "admin=PAM-SuperAdmins,secops=PAM-SecOps,netops=PAM-NetAdmins,user=PAM-ReadOnly"
    depends_on:
      auth:
        condition: service_healthy
      policy:
        condition: service_healthy
    ports:
      - "${PAM_TACACS_PORT:-49}:49"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "49"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  pam-net:
    driver: bridge

volumes:
  pam-data:
    name: pam-data
  pam-rec:
    name: pam-rec
