<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>PAM — RDP Session (Recorded)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1e293b; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 10px 16px; background: #0f172a; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #334155; flex-wrap: wrap; }
    header h1 { font-size: 15px; font-weight: 600; }
    header .muted { font-size: 12px; color: #94a3b8; }
    .toolbar { display: flex; align-items: center; gap: 6px; }
    .toolbar button { padding: 6px 12px; border-radius: 6px; border: 1px solid #475569; background: #334155; color: #e2e8f0; cursor: pointer; font-size: 13px; }
    .toolbar button:hover { background: #475569; }
    #displayWrap { flex: 1; min-height: 320px; overflow: auto; background: #000; display: flex; align-items: center; justify-content: center; }
    #display { outline: none; line-height: 0; }
    #display.focused { box-shadow: inset 0 0 0 2px #38bdf8; }
    #displayWrap.remote-active,
    #displayWrap.remote-active #display,
    #displayWrap.remote-active .guacamole-display canvas { cursor: none !important; }
    #status { padding: 8px 16px; font-size: 12px; background: #0f172a; color: #94a3b8; }
    .err { color: #f87171; }
  </style>
  <script>window.module={exports:{}};</script>
  <script src="/vendor/guacamole-common.min.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>PAM Recorded RDP Session</h1>
      <div class="muted" id="sessionLabel">Connecting…</div>
    </div>
    <div class="toolbar">
      <button type="button" id="fitBtn" title="Fit desktop to window">Fit to window</button>
      <button type="button" id="fullscreenBtn" title="Fullscreen">Fullscreen</button>
      <button type="button" id="disconnectBtn">Disconnect</button>
    </div>
  </header>
  <div id="displayWrap">
    <div id="display" tabindex="0" aria-label="Remote desktop"></div>
  </div>
  <div id="status">Session is recorded by PAM for audit.</div>
  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = params.get("session");
    const token = params.get("token");
    const statusEl = document.getElementById("status");
    const labelEl = document.getElementById("sessionLabel");
    const displayEl = document.getElementById("display");
    const displayWrap = document.getElementById("displayWrap");

    function showErr(msg) {
      statusEl.textContent = msg;
      statusEl.className = "err";
    }

    if (typeof Guacamole === "undefined") {
      showErr("Guacamole client failed to load — redeploy api-gateway.");
    } else if (!sessionId || !token) {
      showErr("Missing session or token — launch RDP from the PAM portal.");
    } else {
      labelEl.textContent = "Session: " + sessionId;
      statusEl.textContent = "Connecting via PAM (guacd)…";

      const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
      const wsBase = wsProto + "//" + location.host + "/api/rdp/websocket-tunnel";
      const tunnel = new Guacamole.WebSocketTunnel(wsBase);
      const client = new Guacamole.Client(tunnel);
      const guacDisplay = client.getDisplay();
      const guacScreen = guacDisplay.getElement();
      displayEl.appendChild(guacScreen);

      let connected = false;
      let mouseMovePending = false;
      let lastMoveState = null;

      function wrapperSize() {
        return {
          w: Math.max(displayWrap.clientWidth, 800),
          h: Math.max(displayWrap.clientHeight, 480),
        };
      }

      /** Use Guacamole's scale() so the canvas is visible AND mouse coords stay aligned. */
      function fitToWindow() {
        const dw = guacDisplay.getWidth();
        const dh = guacDisplay.getHeight();
        if (dw <= 0 || dh <= 0) return;
        const ww = Math.max(displayWrap.clientWidth, 400);
        const wh = Math.max(displayWrap.clientHeight, 300);
        const scale = Math.min(ww / dw, wh / dh);
        guacDisplay.scale(scale);
      }

      function sendDisplaySize() {
        if (!connected) return;
        const dim = wrapperSize();
        client.sendSize(dim.w, dim.h);
      }

      function scaledMouseState(state) {
        const scale = guacDisplay.getScale();
        if (!scale || scale === 1) return state;
        return {
          x: state.x / scale,
          y: state.y / scale,
          left: state.left,
          middle: state.middle,
          right: state.right,
          up: state.up,
          down: state.down,
        };
      }

      function sendMouse(state) {
        client.sendMouseState(scaledMouseState(state));
      }

      guacDisplay.onresize = () => fitToWindow();

      const mouse = new Guacamole.Mouse(guacScreen);
      mouse.onmousedown = mouse.onmouseup = state => {
        if (!connected) return;
        sendMouse(state);
      };
      mouse.onmousemove = state => {
        if (!connected) return;
        lastMoveState = state;
        if (mouseMovePending) return;
        mouseMovePending = true;
        requestAnimationFrame(() => {
          mouseMovePending = false;
          if (lastMoveState) sendMouse(lastMoveState);
        });
      };

      const keyboard = new Guacamole.Keyboard(displayEl);
      displayEl.addEventListener("focus", () => displayEl.classList.add("focused"));
      displayEl.addEventListener("blur", () => displayEl.classList.remove("focused"));
      keyboard.onkeydown = keysym => {
        if (!connected) return true;
        client.sendKeyEvent(1, keysym);
      };
      keyboard.onkeyup = keysym => {
        if (!connected) return true;
        client.sendKeyEvent(0, keysym);
      };

      client.onstatechange = state => {
        if (state === Guacamole.Client.State.CONNECTED) {
          connected = true;
          displayWrap.classList.add("remote-active");
          if (typeof guacDisplay.showCursor === "function") {
            guacDisplay.showCursor(true);
          }
          sendDisplaySize();
          setTimeout(() => {
            fitToWindow();
            displayEl.focus();
          }, 200);
          statusEl.textContent = "Connected — click the desktop for keyboard and mouse.";
          statusEl.className = "";
        }
        if (state === Guacamole.Client.State.DISCONNECTED) {
          displayWrap.classList.remove("remote-active");
          statusEl.textContent = connected
            ? "Disconnected. Recording saved in PAM Sessions tab."
            : "Disconnected before connect — Launch again from the portal.";
          if (!connected) statusEl.className = "err";
        }
      };

      client.onerror = err => {
        showErr("Connection error: " + (err && err.message ? err.message : "unknown"));
      };

      function connect() {
        const dim = wrapperSize();
        client.connect(
          "session=" + encodeURIComponent(sessionId)
          + "&token=" + encodeURIComponent(token)
          + "&width=" + dim.w
          + "&height=" + dim.h
        );
      }

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        if (!connected) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          sendDisplaySize();
          fitToWindow();
        }, 250);
      });

      tunnel.onerror = status => {
        let msg = "Tunnel error — ";
        if (status && status.code === 519) {
          msg += "guacd could not reach or log in to the Windows host. Check credentials and docker logs pam-guacd.";
        } else if (status && status.message) {
          msg += status.message;
        } else {
          msg += JSON.stringify(status);
        }
        showErr(msg);
      };

      document.getElementById("fitBtn").onclick = () => {
        sendDisplaySize();
        fitToWindow();
        displayEl.focus();
      };
      document.getElementById("fullscreenBtn").onclick = async () => {
        try {
          if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
          else await document.exitFullscreen();
          setTimeout(() => { sendDisplaySize(); fitToWindow(); }, 200);
        } catch (_) {}
      };
      document.getElementById("disconnectBtn").onclick = () => client.disconnect();
      displayEl.addEventListener("mousedown", () => { if (connected) displayEl.focus(); });

      requestAnimationFrame(() => connect());
    }
  </script>
</body>
</html>
