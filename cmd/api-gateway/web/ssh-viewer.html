<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>PAM — SSH Session (Recorded)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 10px 16px; background: #020617; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #334155; font-family: system-ui, sans-serif; flex-wrap: wrap; }
    header h1 { font-size: 15px; font-weight: 600; }
    header .muted { font-size: 12px; color: #94a3b8; }
    .toolbar { display: flex; align-items: center; gap: 6px; }
    .toolbar button { padding: 6px 12px; border-radius: 6px; border: 1px solid #475569; background: #334155; color: #e2e8f0; cursor: pointer; font-size: 14px; min-width: 36px; }
    .toolbar button:hover { background: #475569; }
    #zoomLabel { font-size: 12px; color: #94a3b8; min-width: 48px; text-align: center; }
    #displayWrap { flex: 1; min-height: 320px; overflow: auto; background: #111; position: relative; }
    #display { min-height: 100%; width: 100%; position: relative; }
    #display > div { transform-origin: 0 0; }
    #status { padding: 8px 16px; font-size: 12px; background: #020617; color: #94a3b8; font-family: system-ui, sans-serif; }
    .err { color: #f87171; }
    #fallback { display: none; padding: 24px; font-family: system-ui, sans-serif; max-width: 560px; }
    #fallback h2 { font-size: 16px; margin-bottom: 8px; }
    #fallback p { font-size: 13px; color: #94a3b8; margin-bottom: 12px; line-height: 1.5; }
    #fallback a { color: #38bdf8; }
    #display:focus { outline: 1px solid #38bdf8; outline-offset: -1px; }
    #display, #display * { cursor: text; }
    #clipFallback { position: fixed; left: -9999px; top: 0; opacity: 0; }
  </style>
  <script>window.module={exports:{}};</script>
  <script src="/vendor/guacamole-common.min.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>PAM Recorded SSH Session</h1>
      <div class="muted" id="sessionLabel">Connecting…</div>
    </div>
    <div class="toolbar">
      <button type="button" id="zoomOutBtn" title="Zoom out">−</button>
      <span id="zoomLabel">100%</span>
      <button type="button" id="zoomInBtn" title="Zoom in">+</button>
      <button type="button" id="disconnectBtn">Disconnect</button>
    </div>
  </header>
  <div id="displayWrap">
    <div id="display" tabindex="0" title="Click here to type"></div>
  </div>
  <textarea id="clipFallback" aria-hidden="true" tabindex="-1"></textarea>
  <div id="fallback">
    <h2>Browser session could not connect</h2>
    <p id="fallbackMsg">Use Terminal or PuTTY from the PAM portal Launch dialog instead.</p>
    <p><a href="/">← Back to PAM portal</a></p>
  </div>
  <div id="status">Session is recorded by PAM for audit.</div>
  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = params.get("session");
    const token = params.get("token");
    const statusEl = document.getElementById("status");
    const labelEl = document.getElementById("sessionLabel");
    const fallbackEl = document.getElementById("fallback");
    const displayEl = document.getElementById("display");
    const clipFallback = document.getElementById("clipFallback");
    const zoomLabel = document.getElementById("zoomLabel");
    const KEYSYM_RETURN = 0xFF0D;

    function copyToPC(text) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {
          clipFallback.value = text;
          clipFallback.select();
          document.execCommand("copy");
        });
      } else {
        clipFallback.value = text;
        clipFallback.select();
        document.execCommand("copy");
      }
    }

    function showFallback(msg) {
      statusEl.textContent = msg;
      statusEl.className = "err";
      displayEl.style.display = "none";
      fallbackEl.style.display = "block";
      document.getElementById("fallbackMsg").textContent =
        msg + " Use Open in Terminal or Open in PuTTY from the Launch dialog in the portal.";
    }

    if (typeof Guacamole === "undefined") {
      showFallback("Guacamole client library failed to load (/vendor/guacamole-common.min.js). Redeploy api-gateway.");
    } else if (!sessionId || !token) {
      showFallback("Missing session or token — launch SSH from the PAM portal.");
    } else {
      labelEl.textContent = "Session: " + sessionId;
      statusEl.textContent = "Connecting via PAM (guacd + SSH proxy)…";
      const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
      const wsBase = wsProto + "//" + location.host + "/api/rdp/websocket-tunnel";

      const tunnel = new Guacamole.WebSocketTunnel(wsBase);
      const client = new Guacamole.Client(tunnel);
      const guacDisplay = client.getDisplay();
      const guacScreen = guacDisplay.getElement();
      displayEl.appendChild(guacScreen);

      let connected = false;
      let zoom = 1;
      let suppressKeysUntil = 0;
      const typedKeysyms = [];

      function setZoom(z) {
        zoom = Math.min(2.5, Math.max(0.5, Math.round(z * 10) / 10));
        if (typeof guacDisplay.scale === "function") {
          guacDisplay.scale(zoom);
        } else {
          guacScreen.style.transform = "scale(" + zoom + ")";
          guacScreen.style.transformOrigin = "0 0";
        }
        zoomLabel.textContent = Math.round(zoom * 100) + "%";
      }

      function rememberKeysym(keysym) {
        typedKeysyms.push(keysym);
        if (typedKeysyms.length > 24) typedKeysyms.shift();
      }

      function recentAscii() {
        let s = "";
        for (const k of typedKeysyms) {
          if (k >= 0x20 && k < 0x7f) s += String.fromCharCode(k);
        }
        return s;
      }

      function maybeStartEnableLock(keysym) {
        if (keysym !== KEYSYM_RETURN) return;
        const tail = recentAscii().trim().toLowerCase();
        if (tail === "en" || tail.endsWith(" en") || /\ben$/.test(tail)) {
          suppressKeysUntil = Date.now() + 3000;
          statusEl.textContent = "Enable: PAM is sending the password — wait for # prompt…";
        }
      }

      // Cisco/network gear: paste as keystrokes (clipboard channel alone is unreliable).
      function pasteAsKeys(text) {
        const normalized = String(text).replace(/\r\n/g, "\n").replace(/\r/g, "\n");
        for (const ch of normalized) {
          if (ch === "\n") {
            client.sendKeyEvent(1, KEYSYM_RETURN);
            client.sendKeyEvent(0, KEYSYM_RETURN);
            continue;
          }
          const sym = ch.charCodeAt(0);
          client.sendKeyEvent(1, sym);
          client.sendKeyEvent(0, sym);
        }
      }

      async function pasteFromClipboard() {
        let text = "";
        if (navigator.clipboard && navigator.clipboard.readText) {
          try { text = await navigator.clipboard.readText(); } catch (_) {}
        }
        if (!text) return;
        pasteAsKeys(text);
      }

      client.onclipboard = function(stream, mimetype) {
        if (!/^text\//.test(mimetype || "")) return;
        const reader = new Guacamole.StringReader(stream);
        let text = "";
        reader.ontext = chunk => { text += chunk; };
        reader.onend = () => copyToPC(text);
      };

      const keyboard = new Guacamole.Keyboard(document);
      keyboard.onkeydown = keysym => {
        if (!connected) return;
        if (Date.now() < suppressKeysUntil) return;
        rememberKeysym(keysym);
        client.sendKeyEvent(1, keysym);
      };
      keyboard.onkeyup = keysym => {
        if (!connected) return;
        maybeStartEnableLock(keysym);
        if (Date.now() < suppressKeysUntil) return;
        client.sendKeyEvent(0, keysym);
      };

      const mouse = new Guacamole.Mouse(guacScreen);
      const sendMouse = e => { if (connected) client.sendMouseState(e.state); };
      if (typeof mouse.onEach === "function") {
        mouse.onEach(["mousedown", "mouseup", "mousemove"], sendMouse);
      } else {
        mouse.onmousedown = mouse.onmouseup = mouse.onmousemove = state => {
          if (connected) client.sendMouseState(state);
        };
      }

      function sendDisplaySize() {
        const wrap = document.getElementById("displayWrap");
        const w = Math.max(Math.floor((wrap.clientWidth || 800) / zoom), 400);
        const h = Math.max(Math.floor((wrap.clientHeight || 480) / zoom), 300);
        client.sendSize(w, h);
      }

      client.onstatechange = state => {
        if (state === Guacamole.Client.State.CONNECTED) {
          connected = true;
          sendDisplaySize();
          statusEl.textContent = "Connected — click terminal, Ctrl+V paste, Ctrl+C copy. Type en only for enable.";
          statusEl.className = "";
          fallbackEl.style.display = "none";
          displayEl.style.display = "";
          displayEl.focus();
        }
        if (state === Guacamole.Client.State.DISCONNECTED) {
          statusEl.textContent = connected
            ? "Disconnected. Recording saved in PAM Sessions tab."
            : "Disconnected before connect — try Terminal or PuTTY from the portal.";
          if (!connected) statusEl.className = "err";
        }
      };
      client.onerror = err => {
        showFallback("Connection error: " + (err && err.message ? err.message : "unknown"));
      };

      function connect() {
        client.connect(
          "session=" + encodeURIComponent(sessionId)
          + "&token=" + encodeURIComponent(token)
          + "&width=" + Math.max(displayEl.clientWidth, 800)
          + "&height=" + Math.max(displayEl.clientHeight, 480)
        );
      }

      window.addEventListener("resize", () => { if (connected) sendDisplaySize(); });

      tunnel.onerror = status => {
        let msg = "Tunnel error — ";
        if (status && status.code === 519) {
          msg += "guacd closed the session. Launch a new session from the portal.";
        } else if (status && status.message) {
          msg += status.message;
        } else {
          msg += JSON.stringify(status);
        }
        showFallback(msg);
      };

      document.addEventListener("keydown", e => {
        if (!connected) return;
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === "v" || e.key === "V")) {
          e.preventDefault();
          e.stopImmediatePropagation();
          pasteFromClipboard();
          return;
        }
        if ((e.ctrlKey || e.metaKey) && (e.key === "=" || e.key === "+")) {
          e.preventDefault();
          setZoom(zoom + 0.1);
          return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key === "-") {
          e.preventDefault();
          setZoom(zoom - 0.1);
        }
      }, true);

      document.addEventListener("paste", e => {
        if (!connected) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        const text = (e.clipboardData && e.clipboardData.getData("text/plain")) || "";
        if (text) pasteAsKeys(text);
      }, true);

      document.getElementById("zoomInBtn").onclick = () => setZoom(zoom + 0.1);
      document.getElementById("zoomOutBtn").onclick = () => setZoom(zoom - 0.1);
      document.getElementById("disconnectBtn").onclick = () => client.disconnect();

      displayEl.addEventListener("mousedown", () => { if (connected) displayEl.focus(); });
      guacScreen.addEventListener("mousedown", () => { if (connected) displayEl.focus(); });

      setZoom(1);
      requestAnimationFrame(() => connect());
    }
  </script>
</body>
</html>
